name: fieldrelay

x-fieldrelay-logging: &fieldrelay-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldrelay}
      POSTGRES_USER: ${POSTGRES_USER:-fieldrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cpus: "0.30"
    mem_limit: 384m
    pids_limit: 160
    logging: *fieldrelay-logging

  api:
    image: ${FIELDRELAY_API_IMAGE:-fieldrelay-api:local}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/.env}
      PORT: "4100"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://fieldrelay.swoop.video}
      ALLOW_CANONICAL_MUTATIONS: "false"
      PUBLIC_WRITE_LIMIT_PER_HOUR: ${PUBLIC_WRITE_LIMIT_PER_HOUR:-120}
      MAX_DEMO_RUNS: ${MAX_DEMO_RUNS:-500}
      MAX_SSE_CONNECTIONS_PER_CLIENT: ${MAX_SSE_CONNECTIONS_PER_CLIENT:-3}
      MAX_SSE_CONNECTIONS_GLOBAL: ${MAX_SSE_CONNECTIONS_GLOBAL:-100}
      DELIVERY_DESTINATION_TYPE: ${DELIVERY_DESTINATION_TYPE:-GENERIC_WEBHOOK}
      DELIVERY_DESTINATION_NAME: ${DELIVERY_DESTINATION_NAME:-ERP Demo / Generic Webhook}
      DELIVERY_DESTINATION_URL: ${DELIVERY_DESTINATION_URL:-local://delivery-simulator}
    expose:
      - "4100"
    networks:
      - edge
      - data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: "0.35"
    mem_limit: 320m
    pids_limit: 128
    logging: *fieldrelay-logging

  web:
    image: ${FIELDRELAY_WEB_IMAGE:-fieldrelay-web:local}
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      # Wrangler resolves its runtime scratch directory relative to the built
      # worker config, while Miniflare and Wrangler also keep disposable local
      # state in these two locations. Keep the image read-only and grant only
      # the exact ephemeral paths exercised by the production command.
      - /home/node/.config:size=32m,mode=1777
      - /srv/fieldrelay-web/dist/server/.wrangler:size=64m,mode=1777
      - /srv/fieldrelay-web/node_modules/.mf:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: "0.50"
    mem_limit: 640m
    pids_limit: 192
    logging: *fieldrelay-logging

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    # The shared host Caddy already owns public ports 80/443. This gateway is
    # deliberately reachable only from the VPS loopback interface; the isolated
    # host-site drop-in proxies fieldrelay.swoop.video to it.
    ports:
      - "127.0.0.1:${FIELDRELAY_ORIGIN_PORT:-18042}:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: "0.15"
    mem_limit: 128m
    pids_limit: 64
    logging: *fieldrelay-logging

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
