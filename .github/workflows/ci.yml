name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # The package currently exposes Expo launch scripts only; these commands use
      # its pinned TypeScript and Vitest binaries without altering package.json.
      - run: npx tsc --noEmit
      - run: npx vitest run

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e FIELDRELAY_DOMAIN=fieldrelay.example
          -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile
      - name: Check operations scripts
        run: shellcheck infra/scripts/*.sh
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t fieldrelay-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t fieldrelay-web:ci .
