name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: fieldrelay_ci
          POSTGRES_USER: fieldrelay_ci
          POSTGRES_PASSWORD: fieldrelay-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldrelay_ci -d fieldrelay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://fieldrelay_ci:fieldrelay-ci-only@127.0.0.1:5432/fieldrelay_ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation
        run: docker compose -p fieldrelay --env-file infra/.env.example -f infra/compose.yaml config --quiet
      - name: Validate Caddy configurations
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -v "$PWD/infra/caddy/host-site.caddy:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Check operations scripts
        run: shellcheck -x -P infra/scripts infra/scripts/*.sh
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t fieldrelay-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t fieldrelay-web:ci .
      - name: Smoke-test hardened web runtime
        shell: bash
        env:
          FIELDRELAY_WEB_IMAGE: fieldrelay-web:ci
        run: |
          cleanup() {
            docker compose -p fieldrelay-ci-web --env-file infra/.env.example -f infra/compose.yaml down --remove-orphans
          }
          trap cleanup EXIT

          docker compose -p fieldrelay-ci-web --env-file infra/.env.example -f infra/compose.yaml \
            up -d --no-deps --no-build --wait --wait-timeout 120 web
          docker compose -p fieldrelay-ci-web --env-file infra/.env.example -f infra/compose.yaml \
            exec -T web node -e \
            "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
